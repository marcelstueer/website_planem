<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img">
  <title>plan.em – Logo mit Wortmarke, helle Variante</title>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200&amp;display=swap');</style>
    <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3b3b3b"/>
      <stop offset="38%"  stop-color="#3b3b3b"/>
      <stop offset="62%"  stop-color="#3898a3"/>
      <stop offset="80%"  stop-color="#40a79e"/>
      <stop offset="100%" stop-color="#4cb398"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="sh_nw" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-5" dy="-5" stdDeviation="2" flood-color="#787878" flood-opacity="0.5"/>
    </filter>
    <filter id="sh_n" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-5" stdDeviation="2" flood-color="#787878" flood-opacity="0.5"/>
    </filter>
    <filter id="sh_w" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-5" dy="0" stdDeviation="2" flood-color="#787878" flood-opacity="0.5"/>
    </filter>
    <filter id="sh_s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="2" flood-color="#787878" flood-opacity="0.5"/>
    </filter>
    <filter id="sh_sw" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-5" dy="5" stdDeviation="2" flood-color="#787878" flood-opacity="0.5"/>
    </filter>
    <filter id="sh_e" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="0" stdDeviation="2" flood-color="#787878" flood-opacity="0.4"/>
    </filter>
    <filter id="sh_ne" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="-5" stdDeviation="2" flood-color="#787878" flood-opacity="0.35"/>
    </filter>
    <filter id="sh_se" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="2" flood-color="#787878" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- LOGOMARK scaled to fit 220×220 centered vertically in 260px canvas -->
  <!-- Source: 698×678, scale=220/678=0.3245, offset x=20, y=20 -->
  <g transform="translate(20,20) scale(0.3245)">

    <!-- P – oben-links (32px) → Schatten rechts -->
    <rect x="51" y="41" width="159" height="159" rx="20" fill="none" stroke="#3b3b3b" stroke-width="32" filter="url(#sh_e)"/>
    <!-- P – oben-mitte (32px) → Schatten unten-links -->
    <rect x="271" y="41" width="159" height="159" rx="20" fill="none" stroke="#3b3b3b" stroke-width="32" filter="url(#sh_sw)"/>
    <!-- e – oben-rechts (11px) → kein Schatten -->
    <rect x="491" y="41" width="159" height="159" rx="7" fill="none" stroke="#3898a3" stroke-width="11"/>

    <!-- P – mitte-links (32px) → Schatten rechts -->
    <rect x="51" y="261" width="159" height="159" rx="20" fill="none" stroke="#3b3b3b" stroke-width="32" filter="url(#sh_e)"/>
    <!-- P – mitte-mitte (22px) → Schatten unten -->
    <rect x="271" y="261" width="159" height="159" rx="14" fill="none" stroke="#3b3b3b" stroke-width="22" filter="url(#sh_s)"/>
    <!-- e – mitte-rechts (18px) → Schatten oben-links -->
    <rect x="491" y="261" width="159" height="159" rx="12" fill="none" stroke="#40a79e" stroke-width="18" filter="url(#sh_nw)"/>

    <!-- P – unten-links (32px) → Schatten rechts -->
    <rect x="51" y="481" width="159" height="159" rx="20" fill="none" stroke="#3b3b3b" stroke-width="32" filter="url(#sh_e)"/>
    <!-- e – unten-mitte (11px) → Schatten oben-rechts -->
    <rect x="271" y="481" width="159" height="159" rx="7" fill="none" stroke="#44ad9c" stroke-width="11" filter="url(#sh_ne)"/>
    <!-- e – unten-rechts (18px) → Schatten links -->
    <rect x="491" y="481" width="159" height="159" rx="12" fill="none" stroke="#4cb398" stroke-width="18" filter="url(#sh_w)"/>

  </g>

  <!-- WORTMARKE -->
  <text x="295" y="148"
    font-family="'Outfit','Helvetica Neue',Arial,sans-serif"
    font-size="112" font-weight="200"
    fill="url(#wg)"
    letter-spacing="10"
    font-feature-settings="'ss01' 1"
    text-anchor="start">planem</text>

</svg>
